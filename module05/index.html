        <main>
            <section class="content-section">
                <h2>About the Game</h2>
<p> Resident Evil, the Japanese franchise, created by Capcom in 1996, is the undisputed pioneer of the "survival horror" genre. The series generally follows members of elite task forces and everyday survivors as they battle bio-organic weapons, most notably zombies, unleashed by the unethical Umbrella Corporation. While it began in a claustrophobic mansion in Raccoon City, the lore has expanded into a global saga of conspiracy, viral evolution, and high-stakes action.
</p>
            </section>

            <section class="content-section">
                <h2>Why I like it</h2>
                <p>I'm drawn to Resident Evil because of its masterclass in sustained tension; the game never lets me get too comfortable. I love how the thick, eerie atmosphere and genuine horror keep me on edge, while the intricate puzzles force me to use my brain even when I'm under pressure. Beyond the scares, I find a deep satisfaction in piecing together the complex backstory through files and environmental storytelling, uncovering the dark secrets behind the biological outbreaks. Ultimately, it’s that perfect loop of survival and discovery, where I’m constantly thinking and moving, that makes the experience so addictive for me.</p>
                
                <ul id="game-facts">
                    <li> It was originally intended to be a first-person remake of 'Sweet Home'.</li>
                    <li>The game is known as 'Biohazard' in Japan.</li>
                    <li>famously memed for the 'Worst Game Dialogue' ever recorded.</li>
                    <li>The Spencer Mansion was inspired by the Overlook Hotel from 'The Shining'.</li>
                    <li>The term 'Survival Horror' was coined specifically for this game's marketing.</li>
                    <li>The 'Zombie Turning' cutscene was the first FMV many players ever saw.</li>
                </ul>
            </section>
        </main>
